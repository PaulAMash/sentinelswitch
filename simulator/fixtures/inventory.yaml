# Canonical asset inventory for the SentinelSwitch digital twin.
# All hostnames, MAC addresses, users and vendors are fictional. OUIs are illustrative only.
#
# schedule: when the device is attached to its switch port on the dataset day (UTC).
#   "always"           -> powered on all day
#   ["07:52", "23:59"] -> attached from 07:52 until end of day (present at the 21:14 baseline)
#   ["07:41", "17:52"] -> attached during that window only
# auth: how the endpoint authenticates to the port (eap-tls, peap, mab, none, static)
oui_vendors:
  "A4:83:E7": Lenovo
  "E8:6A:64": Lenovo
