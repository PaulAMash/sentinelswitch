# SentinelSwitch canonical environment definition.
# Everything downstream (telemetry, Cisco artifacts, dashboard, evidence) derives from this file
# plus inventory.yaml, users.yaml, external.yaml and the scenario definitions.
# All identities, addresses and MAC addresses are fictional. Addressing is RFC 1918 / RFC 5737 only.

organization:
  name: Meridian Esports League
  domain: corp.example.com
  site: Regional Finals LAN (simulated event network)
  timezone: UTC
  context: >
    The twin is presented as a segmented esports tournament network: production workstations and
    player stations on the USERS VLAN, tournament services on the SERVERS VLAN, spectator and vendor
    access on the GUEST VLAN, broadcast/NOC monitoring on the MONITORING VLAN. The assets, telemetry
    and incidents are simulated; the controls and workflow apply to any enterprise access layer.

dataset:
  day: "2026-03-17"
  start: "2026-03-17T00:00:00Z"
  end: "2026-03-18T00:00:00Z"
  # Canonical "now" for the seeded baseline: just before the flagship incident begins.
  baseline_now: "2026-03-17T21:14:00Z"
  seed: 20260317

switch:
  hostname: SW01
  model: WS-C2960X-48FPD-L
  ios_version: "15.2(7)E8"
  image: c2960x-universalk9-mz.152-7.E8.bin
  serial: FOC2140X0LB
  base_mac: "D4:E8:80:2A:1F:80"
  management_ip: 10.10.10.2
  management_vlan: 10
  default_gateway: 10.10.10.1
  uptime_reference: "2025-11-04T13:22:08Z"
  location: "Lab rack R1, RU 20"
  contact: "netops@corp.example.com"
  gig_ports: 48
  tengig_ports: 2
  syslog_host: 10.99.0.10
  ntp_server: 10.30.0.10
  radius_server: 10.30.0.30
  radius_auth_port: 1812
  radius_acct_port: 1813
  snmp_trap_host: 10.99.0.10
  span_session:
    id: 1
    source_vlans: [20, 30, 40, 50]
    direction: both
    destination: Gi1/0/47

vlans:
  - id: 10
    name: MGMT
    subnet: 10.10.10.0/24
    gateway: 10.10.10.1
    purpose: Network management plane (switch SVI, jump host, security stack management)
    dhcp_snooping: false
    dai: false
  - id: 20
    name: USERS
    subnet: 10.20.0.0/24
    gateway: 10.20.0.1
    purpose: Production workstations, tournament admin and player stations (802.1X)
    dhcp_snooping: true
    dai: true
  - id: 30
    name: SERVERS
    subnet: 10.30.0.0/24
    gateway: 10.30.0.1
    purpose: Tournament services (directory, files, RADIUS, intranet, git/CI, updates)
    dhcp_snooping: true
    dai: true
  - id: 40
    name: GUEST
    subnet: 10.40.0.0/24
    gateway: 10.40.0.1
    purpose: Spectator, vendor and event-floor devices (internet only)
    dhcp_snooping: true
    dai: true
  - id: 50
    name: QUARANTINE
    subnet: 10.50.0.0/24
    gateway: 10.50.0.1
    purpose: Isolated containment VLAN (remediation portal only)
    dhcp_snooping: true
    dai: true
  - id: 99
    name: MONITORING
    subnet: 10.99.0.0/24
    gateway: 10.99.0.1
    purpose: "Broadcast/NOC monitoring: security telemetry collector and controller"
    dhcp_snooping: false
    dai: false
  - id: 999
    name: BLACKHOLE
    subnet: null
    gateway: null
    purpose: Parking VLAN for unused ports and trunk native VLAN
    dhcp_snooping: false
    dai: false

dhcp:
  server: 10.30.0.10
  lease_seconds: 28800
  scopes:
    20: {range: [10.20.0.10, 10.20.0.199], reservations_from: 10.20.0.200}
    40: {range: [10.40.0.100, 10.40.0.199]}
    50: {range: [10.50.0.100, 10.50.0.150]}

# Port intent for SW01. Every interface not listed under `ports` is an unused, shut-down port in VLAN 999.
port_defaults:
  user_port:
    mode: access
    access_vlan: 20
    dot1x: true
    mab: true
    guest_vlan: 40
    # Fixed workstation drops are pinned to one sticky address; 802.1X governs identity,
    # port security governs the physical drop. Conference / spare drops override this below.
    port_security: {enabled: true, maximum: 1, violation: restrict, sticky: true}
    bpduguard: true
    storm_control: {broadcast: "1.00", multicast: "1.00"}
    dhcp_snooping_trust: false
    dai_trust: false
    ip_source_guard: true
    spanning_tree_portfast: true
  server_port:
    mode: access
    access_vlan: 30
    dot1x: false
    mab: false
    port_security: {enabled: true, maximum: 1, violation: restrict, sticky: true}
    bpduguard: true
    storm_control: {broadcast: "2.00", multicast: "2.00"}
    dhcp_snooping_trust: false
    dai_trust: false
    ip_source_guard: true
    spanning_tree_portfast: true
  mgmt_port:
    mode: access
    access_vlan: 10
    dot1x: false
    mab: false
    port_security: {enabled: true, maximum: 1, violation: restrict, sticky: true}
    bpduguard: true
    storm_control: {broadcast: "1.00", multicast: "1.00"}
    dhcp_snooping_trust: false
    dai_trust: false
    ip_source_guard: false
    spanning_tree_portfast: true
  trunk_port:
    mode: trunk
    native_vlan: 999
    allowed_vlans: [10, 20, 30, 40, 50, 99]
    dot1x: false
    mab: false
    port_security: {enabled: false}
    bpduguard: false
    storm_control: {broadcast: "5.00"}
    dhcp_snooping_trust: true
    dai_trust: true
    ip_source_guard: false
    spanning_tree_portfast: false
  monitor_port:
    mode: access
    access_vlan: 99
    dot1x: false
    mab: false
    port_security: {enabled: false}
    bpduguard: true
    dhcp_snooping_trust: false
    dai_trust: false
    ip_source_guard: false
    spanning_tree_portfast: true
  unused_port:
    mode: access
    access_vlan: 999
    admin_shutdown: true
    dot1x: false
    mab: false
    port_security: {enabled: false}
    bpduguard: true
    dhcp_snooping_trust: false
    dai_trust: false
    ip_source_guard: false
    spanning_tree_portfast: true

