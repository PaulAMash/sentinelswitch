[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelswitch"
version = "1.0.0"
description = "SentinelSwitch - Autonomous Network Detection & Response Lab (Cisco Catalyst 2960-X digital twin)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Paul Mash"}]
keywords = ["network-security", "cisco", "ndr", "detection-engineering", "zeek", "suricata", "802.1x", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "rich>=13.7,<15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0", "httpx>=0.27,<1.0", "ruff>=0.5,<1.0", "playwright>=1.45,<2.0", "Pillow>=10.3,<12.0"]

[project.scripts]
sentinelswitch = "sentinelswitch.cli:main"

[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["sentinelswitch*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", ".venv", "node_modules", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["sentinelswitch", "simulator"]
